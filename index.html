<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vijay Joshi - AI Engineer specializing in Machine Learning, Deep Learning, LLMs, RAGs, and Computer Vision.">
    <meta name="author" content="Vijay Joshi">
    <meta property="og:title" content="Vijay Joshi | AI Engineer">
    <meta property="og:description" content="AI Engineer passionate about ML, DL, LLMs, and Computer Vision.">
    <meta property="og:type" content="website">
    <link rel="icon" href="images/profile-2.jpg">
    <title>Vijay Joshi | AI Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>

    <!-- Sidebar Nav -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="./" data-route="home" data-tooltip="Home" aria-label="Home"><i class="fas fa-house"></i></a>
            <a href="./about" data-route="about" data-tooltip="About" aria-label="About"><i class="fas fa-user"></i></a>
            <a href="./experience" data-route="experience" data-tooltip="Experience" aria-label="Experience"><i class="fas fa-briefcase"></i></a>
            <a href="./education" data-route="education" data-tooltip="Education" aria-label="Education"><i class="fas fa-graduation-cap"></i></a>
            <a href="./skills" data-route="skills" data-tooltip="Skills" aria-label="Skills"><i class="fas fa-code"></i></a>
            <a href="./projects" data-route="projects" data-tooltip="Projects" aria-label="Projects"><i class="fas fa-folder"></i></a>
            <a href="./achievements" data-route="achievements" data-tooltip="Achievements" aria-label="Achievements"><i class="fas fa-trophy"></i></a>
            <a href="./blogs" data-route="blogs" data-tooltip="Blogs" aria-label="Blogs"><i class="fas fa-book-open"></i></a>
            <a href="./contact" data-route="contact" data-tooltip="Contact" aria-label="Contact"><i class="fas fa-envelope"></i></a>
        </nav>
        <button class="theme-btn" id="themeBtn" title="Toggle theme"><i class="fas fa-moon"></i></button>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <section id="about"></section>
        <div class="divider"></div>
        <section id="experience"></section>
        <div class="divider"></div>
        <section id="education"></section>
        <div class="divider"></div>
        <section id="skills"></section>
        <div class="divider"></div>
        <section id="projects"></section>
        <div class="divider"></div>
        <section id="blogs"></section>
        <div class="divider"></div>
        <section id="achievements"></section>
        <div class="divider"></div>
        <section id="contact"></section>
        <section id="not-found" class="route-not-found">
            <h1>Page not found</h1>
            <p><a href="./" data-route="home">Return to the portfolio</a></p>
        </section>
        <footer class="footer">© 2026 Vijay Joshi</footer>
    </main>

    <button class="faq-launcher" id="faqLauncher" type="button" aria-label="Open portfolio FAQ" aria-controls="faqPanel" aria-expanded="false" title="Portfolio FAQ">
        <i class="fas fa-comment-dots" aria-hidden="true"></i>
    </button>

    <aside class="faq-panel" id="faqPanel" role="dialog" aria-labelledby="faqTitle" hidden>
        <header class="faq-header">
            <div>
                <h2 id="faqTitle">Portfolio FAQ</h2>
                <p>Vijay Joshi · AI Engineer</p>
            </div>
            <button class="faq-close" id="faqClose" type="button" aria-label="Close portfolio FAQ" title="Close">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </header>
        <div class="faq-conversation" id="faqConversation" role="log" aria-live="polite" aria-relevant="additions">
            <p class="faq-message faq-assistant-message">Hi! What would you like to know about Vijay's work?</p>
            <div class="faq-suggestions" id="faqSuggestions"></div>
        </div>
        <form class="faq-form" id="faqForm">
            <label class="faq-sr-only" for="faqInput">Ask a question</label>
            <input id="faqInput" name="question" type="text" placeholder="Ask a question..." autocomplete="off" maxlength="240" required>
            <button type="submit" aria-label="Send question" title="Send question">
                <i class="fas fa-arrow-up" aria-hidden="true"></i>
            </button>
        </form>
    </aside>

    <!-- Section registry: must come before section scripts -->
    <script>
        function registerSection(id, html) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = html;
        }
    </script>

    <!-- Section files -->
    <script src="sections/about.js"></script>
    <script src="sections/experience.js"></script>
    <script src="sections/education.js"></script>
    <script src="sections/skills.js"></script>
    <script src="sections/projects.js"></script>
    <script src="sections/blogs.js"></script>
    <script src="sections/achievements.js"></script>
    <script src="sections/contact.js"></script>

    <!-- Main app logic -->
    <script src="portfolio.js"></script>
    <script src="faq.js"></script>
</body>
</html>
