<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading page...</title>
</head>
<body>
    <p>Opening page...</p>
    <script>
        const path = window.location.pathname.replace(/\/+$/, '');
        const route = path.split('/').pop();
        const basePath = path.slice(0, -route.length) || '/';
        window.location.replace(`${basePath}?__route=${encodeURIComponent(route)}`);
    </script>
</body>
</html>
