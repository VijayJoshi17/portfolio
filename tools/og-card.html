<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card template</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #0e0e0d; }
    .card { position: relative; width: 1200px; height: 630px; color: #edebe4; font-family: 'JetBrains Mono', monospace; }
    canvas { position: absolute; inset: 0; }
    .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0e0e0d 0%, #0e0e0d 38%, rgba(14,14,13,.55) 62%, rgba(14,14,13,0) 100%); }
    .content { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 20px; color: #bdbab0; }
    .mark { width: 40px; height: 40px; border: 1.5px solid #edebe4; display: grid; place-items: center; font-size: 17px; color: #edebe4; letter-spacing: -.04em; }
    .kicker { margin-top: auto; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: #ff7a4a; }
    .title { margin-top: 18px; font-family: 'Instrument Serif', serif; font-weight: 400; line-height: .98; letter-spacing: -.02em; max-width: 900px; }
    .title .dim { color: #8a877e; display: block; }
    .title em { color: #ff7a4a; }
    .foot { margin-top: 36px; display: flex; justify-content: space-between; font-size: 18px; color: #8a877e; border-top: 1px solid #262522; padding-top: 22px; }
</style>
</head>
<body>
<div class="card">
    <canvas id="field" width="1200" height="630"></canvas>
    <div class="fade"></div>
    <div class="content">
        <div class="brand"><span class="mark">vj</span>Vijay Joshi</div>
        <p class="kicker" id="kicker"></p>
        <h1 class="title" id="title"></h1>
        <div class="foot"><span>vijayjoshi17.github.io/portfolio</span><span id="tags">LLMs · RAG · Agents · Computer Vision</span></div>
    </div>
</div>
<script>
    // Card content comes from the URL: ?kind=home or ?kind=post&title=…&kicker=…&seed=…
    const params = new URLSearchParams(location.search);
    const kind = params.get('kind') || 'home';
    const title = document.getElementById('title');
    if (kind === 'home') {
        document.getElementById('kicker').textContent = 'AI Engineer · Ahmedabad, India';
        title.innerHTML = 'Vijay Joshi<span class="dim">builds systems that <em>retrieve.</em></span>';
        title.style.fontSize = '112px';
    } else {
        document.getElementById('kicker').textContent = params.get('kicker') || 'Writing';
        title.textContent = params.get('title') || '';
        const length = title.textContent.length;
        title.style.fontSize = (length > 70 ? 70 : length > 48 ? 82 : 96) + 'px';
        document.getElementById('tags').textContent = params.get('tags') || 'Writing';
    }

    // Background: the same similarity glyph field as Fig. 1 on the site.
    function mulberry32(seed) {
        return function () {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    function draw() {
        const ctx = document.getElementById('field').getContext('2d');
        const rng = mulberry32(parseInt(params.get('seed') || '17', 10));
        const q = { x: 880 + (rng() - 0.5) * 80, y: 300 + (rng() - 0.5) * 80 };
        const sigma = 210;
        const ramp = ' .·:-=+*#%@';
        const cell = 16;
        ctx.font = '14px "JetBrains Mono"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let y = cell / 2; y < 630; y += cell) {
            for (let x = cell / 2; x < 1200; x += cell) {
                const d2 = (x - q.x) ** 2 + (y - q.y) ** 2;
                const s = Math.exp(-d2 / (2 * sigma * sigma));
                const glyph = ramp[Math.min(ramp.length - 1, Math.floor(s * 0.95 * ramp.length))];
                if (glyph === ' ') continue;
                ctx.fillStyle = `rgba(237,235,228,${(0.08 + s * 0.4).toFixed(3)})`;
                ctx.fillText(glyph, x, y);
            }
        }
        const docs = Array.from({ length: 34 }, () => ({ x: 560 + rng() * 620, y: 40 + rng() * 550 }));
        const picked = docs.slice().sort((a, b) => ((a.x - q.x) ** 2 + (a.y - q.y) ** 2) - ((b.x - q.x) ** 2 + (b.y - q.y) ** 2))
            .filter((doc, i, list) => list.slice(0, i).every(o => (o.x - doc.x) ** 2 + (o.y - doc.y) ** 2 > 140 ** 2)).slice(0, 4);
        ctx.strokeStyle = 'rgba(255,122,74,.7)';
        ctx.lineWidth = 1.5;
        picked.forEach(doc => { ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(doc.x, doc.y); ctx.stroke(); });
        docs.forEach(doc => {
            const on = picked.includes(doc);
            ctx.fillStyle = on ? '#ff7a4a' : 'rgba(138,135,126,.9)';
            ctx.beginPath(); ctx.arc(doc.x, doc.y, on ? 5 : 3, 0, Math.PI * 2); ctx.fill();
            if (on) { ctx.beginPath(); ctx.arc(doc.x, doc.y, 11, 0, Math.PI * 2); ctx.stroke(); }
        });
        ctx.strokeStyle = '#edebe4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(q.x - 16, q.y); ctx.lineTo(q.x - 6, q.y); ctx.moveTo(q.x + 6, q.y); ctx.lineTo(q.x + 16, q.y);
        ctx.moveTo(q.x, q.y - 16); ctx.lineTo(q.x, q.y - 6); ctx.moveTo(q.x, q.y + 6); ctx.lineTo(q.x, q.y + 16);
        ctx.stroke();
        document.body.dataset.ready = 'true';
    }
    document.fonts.ready.then(draw);
</script>
</body>
</html>
